services:
  neo4j:
    image: neo4j:5-community
    container_name: otonom_neo4j
    ports:
      - "7474:7474" # Browser UI
      - "7687:7687" # Bolt (driver baglantisi)
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["graph-data-science"]
    volumes:
      - neo4j_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: otonom_qdrant
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  # Arama/MCP/ajan izleri (backend/shared/tracing.py). UI + OTLP (/v1/traces) + MCP (/mcp) ayni portta.
  # Sadece localhost'a acik; disaridan erisim Cloudflare tuneliyle (PHOENIX_PUBLIC_URL).
  phoenix:
    image: arizephoenix/phoenix:version-20.22.0
    container_name: otonom_phoenix
    ports:
      - "127.0.0.1:6006:6006"
    environment:
      - PHOENIX_WORKING_DIR=/mnt/data
      - PHOENIX_ENABLE_AUTH=True
      - PHOENIX_SECRET=${PHOENIX_SECRET}
      - PHOENIX_ADMIN_SECRET=${PHOENIX_ADMIN_SECRET}
      - PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD=${PHOENIX_ADMIN_PASSWORD}
      - PHOENIX_ROOT_URL=${PHOENIX_PUBLIC_URL:-http://localhost:6006}
      - PHOENIX_DEFAULT_RETENTION_POLICY_DAYS=90
    volumes:
      - phoenix_data:/mnt/data

volumes:
  neo4j_data:
  qdrant_data:
  phoenix_data:
